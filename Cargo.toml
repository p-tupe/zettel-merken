[package]
name = "zettel-merken"
description = "Supercharge your learning using zettelkasten and spaced repetition"
version = "0.1.1"
edition = "2024"
authors = ["Pritesh Tupe <mail@priteshtupe.com>"]
documentation = "https://github.com/p-tupe/zettel-merken"
readme = "README.md"
repository = "https://github.com/p-tupe/zettel-merken"
license = "MIT"
keywords = ["knowledge", "management", "notification"]
categories = ["command-line-utilities"]

[profile.dev]
incremental = true

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
globset = "0.4.20"
mac-notification-sys = "0.6.15"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["serde"] }
walkdir = "2.5.0"
